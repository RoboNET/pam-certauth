# pre-commit hooks for pam_certauth.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^crates/pam_certauth_core/tests/fixtures/'
      - id: end-of-file-fixer
        exclude: '^crates/pam_certauth_core/tests/fixtures/'
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=200']

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: bash-syntax
        name: bash -n on shell scripts
        entry: bash -n
        language: system
        types: [shell]

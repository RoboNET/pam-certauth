[package]
name = "pam_certauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PAM module for USB-certificate authentication on Astra Linux SE."

[lib]
crate-type = ["cdylib", "rlib"]
name = "pam_certauth"

[features]
default = []
# See `pam_certauth_core`'s `gost-tests` feature for details — this re-exports
# it so `cargo test --workspace --features gost-tests` activates both crates'
# integration tests in lockstep.
gost-tests = ["pam_certauth_core/gost-tests"]
# Re-export of `pam_certauth_core/pkcs11-tests` so `cargo test --workspace
# --features pkcs11-tests` activates both crates' integration tests in lockstep.
pkcs11-tests = ["pam_certauth_core/pkcs11-tests"]

[dependencies]
pam_certauth_core = { path = "../pam_certauth_core", version = "0.2.3" }
pam_certauth_proto = { path = "../pam_certauth_proto", version = "0.2.3" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
syslog = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
openssl = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pam-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints.rust]
missing_docs = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
missing_safety_doc = "deny"
# Unsafe hardening — every unsafe block must carry a `// SAFETY:` line.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
# Pointer / cast hygiene.
transmute_ptr_to_ptr = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
ref_as_ptr = "warn"
# Footgun catchers for a binary that runs inside sshd as root.
let_underscore_lock = "deny"
exit = "warn"

# /usr/lib/tmpfiles.d/pam-certauth.conf
# Runtime directories for pam_certauth. Created at boot and on every
# `systemd-tmpfiles --create`. Owned by the dedicated `pamcertauth`
# system user (created by debian/postinst); pam_certauth.so reads the
# IPC socket as root via PAM-caller context, owner+group both
# pamcertauth keep the daemon's writes confined.
d /run/pam_certauth          0750 pamcertauth pamcertauth -
d /run/pam_certauth/sessions 0750 pamcertauth pamcertauth -

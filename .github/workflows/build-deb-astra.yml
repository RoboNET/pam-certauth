name: build-deb-astra

# Native Astra Linux build with the `astra-mac` feature enabled. Unlike the
# stub `build-deb.yml` job (which runs on plain ubuntu-22.04 and produces a
# package that does *not* link against libpdp), this job runs inside an
# Astra Linux container so we can exercise the real MAC FFI bindings and
# emit a .deb suitable for installation on an Astra SE VM/host.
#
# Uses a pre-built builder image (see build-builder-image.yml + docker/
# astra-builder.Dockerfile) so build deps, rust toolchain, parsec-base and
# unversioned linker symlinks are baked into the image instead of being
# installed on every run.
#
# This workflow is additive: it does not modify or replace build-deb.yml.

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  # Re-run after the builder image finishes rebuilding so we link against a
  # fresh `:latest` (avoids race when a single push touches both the
  # Dockerfile and Rust code linking new system libraries).
  workflow_run:
    workflows: ["build-builder-image"]
    types: [completed]
    branches: [main, 'feat/**']

permissions:
  contents: read
  packages: read

# Cancel in-progress builds when a newer commit lands on the same branch.
# Saves runner-minutes when WIP iteratively pushes fixes. For workflow_run
# triggers github.ref points at the default branch, so prefer the upstream
# run's head_branch to keep the concurrency group aligned with the source
# branch (and let a fresh-image rerun cancel a stale push-triggered run).
concurrency:
  group: build-deb-astra-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-astra:
    # Skip when triggered by a failed/cancelled upstream builder run; keep
    # normal push/PR runs unconditional.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    # Workflow-level env so Swatinem/rust-cache, sccache, cargo test и
    # scripts/build-deb.sh видят identical fingerprint (CARGO_HOME +
    # release profile knobs match debian/rules). Без alignment cargo
    # пересобирает с нуля при переходе test → build-deb.
    env:
      CARGO_HOME: ${{ github.workspace }}/debian/cargo_home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_LTO: "thin"
    container:
      image: ghcr.io/robonet/pam-certauth-astra-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SOURCE_DATE_EPOCH
          # On workflow_run triggers github.sha points at the default branch
          # tip, not the commit that produced the freshly-built image. Pull
          # the upstream run's head_sha so we build the right revision. The
          # `||` fallback collapses to github.sha for push/PR events where
          # workflow_run context is absent.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Trust workspace as git repository
        # Container-uid mismatch + GHA workspace mount makes git refuse to
        # discover the repo inside the Astra container. Mark it safe so
        # build-deb.sh's `git describe`/`git log` calls succeed.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Cargo workspace version matches debian/changelog
        run: |
          set -euo pipefail
          cargo_ver=$(grep -E '^version\s*=' Cargo.toml | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/')
          deb_ver=$(head -1 debian/changelog \
              | sed -E 's/^[^(]+\(([^-]+).*/\1/')
          echo "Cargo workspace version : ${cargo_ver}"
          echo "debian/changelog version: ${deb_ver}"
          if [ "${cargo_ver}" != "${deb_ver}" ]; then
              echo "::error::Cargo.toml version (${cargo_ver}) != debian/changelog (${deb_ver}). Bump debian/changelog before releasing."
              exit 1
          fi

      - name: Probe Astra environment
        run: |
          set -euxo pipefail
          cat /etc/astra_version || true
          uname -a
          rustc --version
          cargo --version
          dpkg --version

      - name: Verify libpdp runtime symbols
        run: |
          set -euxo pipefail
          dpkg -l | grep -iE 'parsec|libpdp' || true
          LIBPDP="$(ls /usr/lib/libpdp.so.* 2>/dev/null | head -n1 || true)"
          if [ -z "$LIBPDP" ]; then
            LIBPDP="$(ls /usr/lib/x86_64-linux-gnu/libpdp.so.* 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$LIBPDP" ]; then
            echo "error: libpdp.so.* not found in builder image" >&2
            exit 1
          fi
          echo "found libpdp at $LIBPDP"
          nm -D "$LIBPDP" | grep -E 'pdpl_get_from_text|pdp_set_pid|parsec_strict_mode' || true
          nm -D /lib/libparsec-base.so* /usr/lib/libparsec-base.so* /usr/lib/x86_64-linux-gnu/libparsec-base.so* 2>/dev/null \
            | grep -E 'parsec_capget|parsec_capset' | head || true

      - name: Cache cargo registry + target (Swatinem/rust-cache)
        # Smarter than raw actions/cache: scopes by job + rustc version,
        # auto-evicts stale target/ entries, writes only when reused.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: astra-mac
          cache-on-failure: true
          cache-all-crates: true

      - name: Configure sccache (compiler-level cache)
        # Caches rustc object output keyed by source hash. Combined with
        # Swatinem (which caches deps + target/), sccache eliminates
        # recompilation of unchanged compilation units across cache misses.
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run cargo nextest with real libpdp (astra-mac feature)
        # This is the main value of the job: actually link against libpdp
        # and exercise the MAC FFI on Astra. Workflow-level env aligns
        # the test build with debian/rules so build-deb only relinks.
        # cargo-nextest (pre-installed in builder image) parallelises
        # test execution and shaves 30–50% off plain `cargo test`.
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run --workspace --features astra-mac --release

      - name: Build .deb with astra-mac feature
        env:
          DEB_CARGO_EXTRA_OPTIONS: "--features astra-mac"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: scripts/build-deb.sh --allow-dirty --skip-lintian

      - name: Show deb contents
        run: dpkg -c ../pam-certauth_*.deb

      - name: Stage artifacts inside workspace
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          for f in ../pam-certauth_*.deb ../pam-certauth_*.changes ../pam-certauth_*.buildinfo; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "artifacts/$base"
          done
          ls -la artifacts/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pam-certauth-deb-astra
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

name: build-deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SOURCE_DATE_EPOCH

      - name: Verify Cargo workspace version matches debian/changelog
        run: |
          set -euo pipefail
          cargo_ver=$(grep -E '^version\s*=' Cargo.toml | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/')
          deb_ver=$(head -1 debian/changelog \
              | sed -E 's/^[^(]+\(([^-]+).*/\1/')
          echo "Cargo workspace version : ${cargo_ver}"
          echo "debian/changelog version: ${deb_ver}"
          if [ "${cargo_ver}" != "${deb_ver}" ]; then
              echo "::error::Cargo.toml version (${cargo_ver}) != debian/changelog (${deb_ver}). Bump debian/changelog before releasing."
              exit 1
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debhelper dh-cargo \
            libssl-dev libudev-dev libdbus-1-dev libpam0g-dev libsystemd-dev \
            clang libclang-dev \
            pkg-config lintian devscripts fakeroot build-essential

      - name: Install Rust toolchain (pinned, satisfies workspace rust-version)
        # Workspace declares rust-version = "1.95"; Ubuntu 22.04 distro Rust
        # is ~1.75 and would fail every cargo invocation. Install rustup with
        # no default toolchain, then install the toolchain pinned in
        # rust-toolchain.toml (channel = "1.95.0") so every cargo invocation
        # in subsequent steps picks it up automatically via the override
        # file.
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          # Make rustup-installed cargo/rustc visible to subsequent steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Install the pinned toolchain (matches rust-toolchain.toml) with
          # the components we need. cargo within the project tree will pick
          # this up automatically via the toolchain file.
          "$HOME/.cargo/bin/rustup" toolchain install 1.95.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt

      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version
          dpkg --version

      - name: Run cargo test (regression guard)
        run: cargo test --workspace

      - name: Build .deb
        run: scripts/build-deb.sh --allow-dirty

      - name: Show deb contents
        run: dpkg -c ../pam-certauth_*.deb

      - name: Stage artifacts inside workspace
        run: |
          mkdir -p artifacts
          cp ../pam-certauth_*.deb ../pam-certauth_*.changes ../pam-certauth_*.buildinfo artifacts/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pam-certauth-deb
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pam-certauth-deb
          path: ./artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
